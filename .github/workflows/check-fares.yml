name: Check fares TPE → KIX

on:
  # 已改用自家電腦上的常駐服務（install.sh）定時掃描，這裡只保留手動執行。
  # 若不用 bot、想改回由 GitHub 定時跑，把下面兩行取消註解（兩邊同時跑會重複查詢）。
  # schedule:
  #   - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        type: choice
        options: [check, test-telegram]
        default: check

permissions:
  contents: read

concurrency:
  group: check-fares
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 狀態（查過哪些日期、通知過哪些班機）存在 Actions cache，跨次執行沿用
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: fare-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fare-state-

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          # 以下可在 Settings → Secrets and variables → Actions → Variables 覆寫
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          MAX_STOPS: ${{ vars.MAX_STOPS }}
          DAYS_AHEAD_MAX: ${{ vars.DAYS_AHEAD_MAX }}
          DATES_PER_RUN: ${{ vars.DATES_PER_RUN }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR }}
        run: |
          if [ "${{ inputs.mode }}" = "test-telegram" ]; then
            python -m ticket_watch --test-telegram
          else
            python -m ticket_watch
          fi

      - name: Save state
        if: always() && inputs.mode != 'test-telegram'
        uses: actions/cache/save@v4
        with:
          path: state
          key: fare-state-${{ github.run_id }}-${{ github.run_attempt }}
